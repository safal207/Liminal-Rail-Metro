name: Persistent Station v0.3

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: write

jobs:
  persistent-station:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Liminal Rail Metro
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: false

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Checkout proven persistent Lifetra station
        uses: actions/checkout@v4
        with:
          repository: safal207/Lifetra
          ref: 61b9d7ecdb59cea5a7b89675fdf5bd8c49bd6b55
          path: _deps/Lifetra

      - name: Canonicalize Go formatting
        run: |
          files="$(find . -path './_deps' -prune -o -name '*.go' -print)"
          unformatted="$(gofmt -l -- $files)"
          if [ -n "$unformatted" ]; then
            echo "Applying gofmt to:"
            echo "$unformatted"
            gofmt -w -- $unformatted
            if [ "${{ github.event_name }}" != "pull_request" ]; then
              echo "Unexpected unformatted Go on a non-PR run" >&2
              git diff --check
              exit 1
            fi
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -- $unformatted
            git commit -m "style: apply gofmt"
            git push origin HEAD:"${{ github.head_ref }}"
          fi

      - name: Go unit tests
        run: go test ./...

      - name: Build persistent Lifetra station
        run: cargo build --release --manifest-path _deps/Lifetra/Cargo.toml --example metro_station_server

      - name: Benchmark warm persistent station
        run: |
          go run ./cmd/persistent-station-bench \
            -station-bin ./_deps/Lifetra/target/release/examples/metro_station_server \
            -iterations 200 > persistent-station-proof.json
          grep -q '"persistent_pid_reused": true' persistent-station-proof.json
          grep -q '"verdict": "PASS"' persistent-station-proof.json
          cat persistent-station-proof.json

      - name: Upload benchmark proof
        uses: actions/upload-artifact@v4
        with:
          name: persistent-station-v0.3-proof
          path: persistent-station-proof.json
