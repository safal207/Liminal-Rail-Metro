name: Independent Roadmap Step 1 QA

on:
  pull_request:
    paths:
      - "qa/roadmap-step1/**"
      - ".github/workflows/independent-roadmap-qa.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  independent-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout QA harness only
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Set up pinned Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.23.12
          cache: false
      - name: Independent pinned source review and adversarial tests
        run: python3 qa/roadmap-step1/run.py "$RUNNER_TEMP/liminal-independent-evidence"
      - name: Preserve raw QA evidence even on HOLD
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: independent-roadmap-step1-evidence
          path: ${{ runner.temp }}/liminal-independent-evidence
          if-no-files-found: error
          retention-days: 14
