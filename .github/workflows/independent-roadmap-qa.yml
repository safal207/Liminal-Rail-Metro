name: Independent Roadmap Step 1 QA

on:
  pull_request:
    paths:
      - "qa/roadmap-step1/**"
      - ".github/workflows/independent-roadmap-qa.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  independent-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TRUSTED_QA_COMMIT: 12de93ab38fa492d22972f71e362a6b306929712
      QA_WORKFLOW_SOURCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout immutable trusted QA runner
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 12de93ab38fa492d22972f71e362a6b306929712
          persist-credentials: false
          fetch-depth: 1
          path: trusted-qa

      - name: Verify trusted runner identity
        run: |
          set -euo pipefail
          test "$(git -C trusted-qa rev-parse HEAD)" = "$TRUSTED_QA_COMMIT"
          sha256sum trusted-qa/qa/trusted-roadmap-step1/run.py | tee "$RUNNER_TEMP/trusted-runner.sha256"

      - name: Set up pinned Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: 1.23.12
          cache: false

      - name: Independent pinned source review and adversarial tests
        run: python3 trusted-qa/qa/trusted-roadmap-step1/run.py "$RUNNER_TEMP/liminal-independent-evidence"

      - name: Preserve trusted-runner identity in evidence
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/liminal-independent-evidence"
          cp "$RUNNER_TEMP/trusted-runner.sha256" "$RUNNER_TEMP/liminal-independent-evidence/trusted-runner.sha256"

      - name: Preserve raw QA evidence even on HOLD
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: independent-roadmap-step1-evidence
          path: ${{ runner.temp }}/liminal-independent-evidence
          if-no-files-found: error
          retention-days: 14
