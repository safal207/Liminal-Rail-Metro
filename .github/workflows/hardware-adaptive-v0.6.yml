name: Hardware Adaptive v0.6

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  device-bound-software-attestation:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: false

      - name: Require gofmt
        run: |
          unformatted="$(gofmt -l -- $(find . -path './_deps' -prune -o -name '*.go' -print))"
          if [ -n "$unformatted" ]; then
            echo "Go files require gofmt:" >&2
            echo "$unformatted" >&2
            gofmt -d -- $unformatted
            exit 1
          fi

      - name: Unit tests
        run: go test ./...

      - name: Run device-bound adaptive proof
        run: |
          rm -f hardware-adaptive-v0.6.journal.jsonl hardware-adaptive-proof-v0.6.json
          go run ./cmd/hardware-adaptive-v06-demo | tee hardware-adaptive-v0.6.log

      - name: Verify proof invariants
        run: |
          python3 - <<'PY'
          import json, re
          from pathlib import Path

          p = json.loads(Path('hardware-adaptive-proof-v0.6.json').read_text())
          assert p['protocol'] == 'liminal.hardware-adaptive-proof.v0.6'
          f = p['flags']
          for key in [
              'device_fingerprint_stable',
              'attestation_verified',
              'stale_nonce_rejected',
              'stale_journal_rejected',
              'wrong_device_key_rejected',
              'tampered_evidence_rejected',
              'restart_state_preserved',
              'device_proof_refs_present',
              'source_values_hashed_only',
          ]:
              assert f[key] is True, (key, f[key])

          evidence = p['device_evidence']
          anchor = p['device_trust_anchor']
          assert evidence['protocol'] == 'liminal.device.evidence.v0.1'
          assert evidence['root_type'] == 'software-observed'
          assert anchor['root_type'] == 'software-observed'
          assert anchor['device_fingerprint'] == evidence['device_fingerprint']
          hex64 = re.compile(r'^[a-f0-9]{64}$')
          assert hex64.fullmatch(evidence['device_fingerprint'])
          assert hex64.fullmatch(evidence['runtime_fingerprint'])
          assert hex64.fullmatch(anchor['attestation_key_id'])
          assert evidence['source_digests']
          for digest in evidence['source_digests'].values():
              assert hex64.fullmatch(digest)

          trials = p['trials']
          assert len(trials) == 6
          assert len({t['challenge_nonce'] for t in trials}) == len(trials)
          signed = p['authority_chain']['grants'][-1]
          for i, t in enumerate(trials):
              att = t['device_attestation']
              assert att['protocol'] == 'liminal.device.attestation.v0.1'
              assert att['root_type'] == 'software-observed'
              assert att['device_fingerprint'] == evidence['device_fingerprint']
              assert att['runtime_fingerprint'] == evidence['runtime_fingerprint']
              assert att['attestation_key_id'] == anchor['attestation_key_id']
              assert att['signed_authority_hash'] == signed['signed_authority_hash']
              assert att['authority_issuer_key_id'] == signed['issuer_key_id']
              assert att['journal_sequence'] == i
              assert t['result']['device_attestation_hash'] == att['attestation_hash']
              assert t['result']['device_fingerprint'] == att['device_fingerprint']
              assert t['result']['runtime_fingerprint'] == att['runtime_fingerprint']
              refs = t['lifetra_observation']['proof_refs']
              assert 'adaptive-device-attestation://sha256/' + att['attestation_hash'] in refs
              assert 'adaptive-device-key://ed25519/sha256/' + att['attestation_key_id'] in refs
              assert 'adaptive-device-fingerprint://sha256/' + att['device_fingerprint'] in refs
              assert 'adaptive-runtime-fingerprint://sha256/' + att['runtime_fingerprint'] in refs

          lines = [line for line in Path(p['journal_path']).read_text().splitlines() if line.strip()]
          assert len(lines) == 6
          print('v0.6 device-bound software attestation invariants: PASS')
          PY

      - name: Show proof summary
        run: |
          cat hardware-adaptive-v0.6.log
          python3 -m json.tool hardware-adaptive-proof-v0.6.json | tail -n 140

      - name: Upload proof artifacts
        uses: actions/upload-artifact@v4
        with:
          name: hardware-adaptive-v0.6-proof
          path: |
            hardware-adaptive-proof-v0.6.json
            hardware-adaptive-v0.6.journal.jsonl
            hardware-adaptive-v0.6.log
