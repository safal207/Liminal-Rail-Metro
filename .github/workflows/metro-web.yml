name: Metro Web

on:
  pull_request:
    paths:
      - 'cmd/metro-web-demo/**'
      - 'cmd/metro-web-check/**'
      - 'internal/metro/**'
      - 'examples/metro-web/**'
      - '.github/workflows/metro-web.yml'
  push:
    branches: [main]
    paths:
      - 'cmd/metro-web-demo/**'
      - 'cmd/metro-web-check/**'
      - 'internal/metro/**'
      - 'examples/metro-web/**'
      - '.github/workflows/metro-web.yml'

permissions:
  contents: read

jobs:
  resource:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.12'
          cache: false
      - name: Test resource adapters, Metro receipts, and independent checker
        run: go test -count=1 -v ./cmd/metro-web-demo ./cmd/metro-web-check ./internal/metro
      - name: Vet
        run: go vet ./cmd/metro-web-demo ./cmd/metro-web-check ./internal/metro
      - name: Race checks
        if: runner.os == 'Linux'
        run: go test -race ./cmd/metro-web-demo ./cmd/metro-web-check
