name: Codex Coding Workflow v0.3

on:
  pull_request:
    paths:
      - "internal/codingworkflow/**"
      - "internal/codexplugin/**"
      - "plugins/liminal-rail-metro/**"
      - "protocol/liminal.codex.coding.*"
      - "cmd/metro-codex/plugin_test.go"
      - ".github/workflows/codex-plugin-v0.1.yml"
      - ".github/workflows/codex-plugin-v0.2-public.yml"
      - ".github/workflows/codex-coding-workflow-v0.3.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  coding-unit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go 1.23
        uses: actions/setup-go@v5
        with:
          go-version: 1.23.x
          cache: false

      - name: Require gofmt
        run: |
          unformatted="$(gofmt -l ./internal/codingworkflow ./internal/codexplugin ./cmd/metro-codex/plugin_test.go)"
          if [ -n "$unformatted" ]; then
            echo "Go files require gofmt:" >&2
            echo "$unformatted" >&2
            gofmt -d $unformatted
            exit 1
          fi

      - name: Full Go tests
        run: go test ./...

      - name: Go vet
        run: go vet ./...

      - name: Coding workflow race checks
        run: go test -race ./internal/codingworkflow ./internal/codexplugin

      - name: Build MCP server
        run: go build ./cmd/codex-mcp

  live-self-proof:
    if: github.event_name == 'pull_request'
    needs: coding-unit
    runs-on: ubuntu-latest
    env:
      MCP_BASE: https://liminal-rail-codex-mcp-production.up.railway.app
      PR_NUMBER: ${{ github.event.pull_request.number }}
      PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Verify live v0.3 server and self-proof PR
        run: |
          python3 - <<'PY'
          import json
          import os
          import time
          import urllib.request

          base = os.environ["MCP_BASE"]
          pr_number = int(os.environ["PR_NUMBER"])

          def rpc(payload, timeout=5):
              request = urllib.request.Request(
                  base + "/mcp",
                  data=json.dumps(payload).encode(),
                  method="POST",
                  headers={
                      "Content-Type": "application/json",
                      "Accept": "application/json, text/event-stream",
                  },
              )
              with urllib.request.urlopen(request, timeout=timeout) as response:
                  data = json.load(response)
                  if response.status != 200:
                      raise RuntimeError(f"HTTP {response.status}: {data!r}")
                  return data

          def structured(response):
              result = response["result"]
              if result.get("isError"):
                  raise RuntimeError(f"MCP tool error: {result!r}")
              if "structuredContent" in result and result["structuredContent"] is not None:
                  return result["structuredContent"]
              for item in result.get("content", []):
                  if item.get("type") == "text":
                      try:
                          return json.loads(item["text"])
                      except Exception:
                          pass
              raise RuntimeError(f"missing structured content: {result!r}")

          status = None
          for _ in range(180):
              try:
                  response = rpc({
                      "jsonrpc": "2.0",
                      "id": 1,
                      "method": "tools/call",
                      "params": {"name": "liminal_status", "arguments": {}},
                  }, timeout=3)
                  status = structured(response)
                  if status.get("version") == "0.3.0" and status.get("coding_workflow_enabled") is True:
                      break
              except Exception:
                  pass
              time.sleep(1)
          else:
              raise SystemExit(f"live v0.3 coding authority did not become ready: {status!r}")

          start = structured(rpc({
              "jsonrpc": "2.0",
              "id": 2,
              "method": "tools/call",
              "params": {
                  "name": "liminal_coding_start",
                  "arguments": {
                      "workflow_id": f"issue-16-pr-{pr_number}",
                      "request_id": f"issue-16-pr-{pr_number}-decision",
                      "action_id": f"issue-16-pr-{pr_number}-coding",
                      "repository": "safal207/Liminal-Rail-Metro",
                      "issue_number": 16,
                      "base_sha": "3600fae8cf1f7bf1ae9ade429e154aab38ff0f2c",
                      "allowed_path_prefixes": [
                          "internal/codingworkflow",
                          "internal/codexplugin",
                          "plugins/liminal-rail-metro",
                          "protocol",
                          "docs",
                          ".github/workflows",
                          "cmd/metro-codex/plugin_test.go"
                      ],
                      "required_checks": ["coding-unit"],
                      "choices": [
                          {"id": "code", "target": "code-agent"},
                          {"id": "qa", "target": "qa-agent"}
                      ],
                      "scores": {"code": 99, "qa": 1}
                  },
              },
          }))
          if start.get("status") != "AUTHORIZED" or not start.get("contract"):
              raise SystemExit(f"coding start did not authorize: {start!r}")

          verified = None
          for _ in range(120):
              verified = structured(rpc({
                  "jsonrpc": "2.0",
                  "id": 3,
                  "method": "tools/call",
                  "params": {
                      "name": "liminal_coding_verify",
                      "arguments": {
                          "contract": start["contract"],
                          "pull_request_number": pr_number,
                      },
                  },
              }))
              if verified.get("status") == "VERIFIED":
                  break
              if verified.get("reason_code") not in {"required_check_missing", "required_check_not_success"}:
                  raise SystemExit(f"self-proof HOLD: {verified!r}")
              time.sleep(2)
          else:
              raise SystemExit(f"self-proof never became VERIFIED: {verified!r}")

          receipt = verified["receipt"]
          assert receipt["head_sha"] == os.environ["PR_HEAD_SHA"]
          assert receipt["status"] == "VERIFIED"
          assert receipt["contract_hash"]
          assert receipt["files_hash"]
          assert receipt["checks_hash"]
          assert receipt["receipt_hash"]
          assert receipt["signature_base64"]
          print(json.dumps({
              "protocol": "liminal.codex.coding.self-proof.v0.3",
              "status": verified["status"],
              "reason_code": verified["reason_code"],
              "workflow_id": receipt["workflow_id"],
              "pr": receipt["pull_request_number"],
              "head_sha": receipt["head_sha"],
              "contract_hash": receipt["contract_hash"],
              "files_hash": receipt["files_hash"],
              "checks_hash": receipt["checks_hash"],
              "receipt_hash": receipt["receipt_hash"],
              "issuer_key_id": receipt["issuer_key_id"],
          }, indent=2))
          PY
