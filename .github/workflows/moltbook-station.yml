name: moltbook-station

on:
  pull_request:
    paths:
      - "integrations/moltbook/**"
      - "internal/metro/**"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/moltbook-station.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run full Go test suite
        run: go test ./...
