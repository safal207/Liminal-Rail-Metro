name: moltbook-station

on:
  pull_request:
    paths:
      - "integrations/moltbook/**"
      - "cmd/moltbook-smoke/**"
      - "internal/metro/**"
      - "internal/decisionplane/**"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/moltbook-station.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Require gofmt
        shell: bash
        run: |
          unformatted="$(gofmt -l integrations/moltbook cmd/moltbook-smoke)"
          if [ -n "$unformatted" ]; then
            echo "$unformatted"
            exit 1
          fi

      - name: Run full Go test suite
        run: go test ./...

      - name: Run focused race checks
        run: go test -race ./integrations/moltbook ./internal/decisionplane ./cmd/moltbook-smoke

      - name: Rehearse and verify sanitized report without live credentials
        run: |
          go run ./cmd/moltbook-smoke > "$RUNNER_TEMP/moltbook-rehearsal.json"
          go run ./cmd/moltbook-smoke -verify-report "$RUNNER_TEMP/moltbook-rehearsal.json"
