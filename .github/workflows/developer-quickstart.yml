name: Developer Quickstart
on:
  pull_request:
    paths:
      - 'cmd/liminal-rail/**'
      - 'internal/**'
      - 'go.mod'
      - 'go.sum'
      - 'Dockerfile.quickstart*'
      - 'compose.yaml'
      - 'QUICKSTART.md'
      - '.github/workflows/developer-quickstart.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
      - name: Record exact checkout
        run: |
          git rev-parse HEAD
          git rev-parse HEAD^{tree}
      - name: Formatting, full suite, vet and focused race
        run: |
          test -z "$(gofmt -l cmd/liminal-rail)"
          go test -count=1 ./...
          go vet ./cmd/liminal-rail
          go test -race -count=1 ./cmd/liminal-rail ./internal/codexadapter ./internal/decisionplane
      - name: Build and run actual Compose quickstart
        run: |
          docker compose config --quiet
          docker compose up --build --wait --wait-timeout 120 rail
          test "$(docker inspect -f '{{.Config.User}}' "$(docker compose ps -q rail)")" = '65532:65532'
          curl --fail --silent http://127.0.0.1:8788/healthz
          docker compose run --rm --no-deps demo | tee quickstart-demo.json
          python3 -c 'import json; d=json.load(open("quickstart-demo.json")); assert d["demo"] == "PASS"; assert d["live_provider"] is False; assert len(d["checks"]) == 5'
      - name: Compose cleanup
        if: always()
        run: docker compose down --remove-orphans
      - uses: actions/upload-artifact@v4
        with:
          name: quickstart-demo-${{ github.event.pull_request.head.sha || github.sha }}
          path: quickstart-demo.json
          if-no-files-found: error
