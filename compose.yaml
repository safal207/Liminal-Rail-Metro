services:
  rail:
    image: liminal-rail-dev:local
    build:
      context: .
      dockerfile: Dockerfile.quickstart
    ports:
      - "127.0.0.1:8788:8788"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 64
    mem_limit: 128m
    cpus: 1
    restart: "no"
    healthcheck:
      test: [CMD, /liminal-rail, healthcheck]
      interval: 3s
      timeout: 2s
      retries: 10
      start_period: 3s
  demo:
    image: liminal-rail-dev:local
    profiles: [demo]
    entrypoint: ["/liminal-rail"]
    command: [demo, -url, "http://rail:8788"]
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 64
    mem_limit: 128m
    cpus: 1
    restart: "no"
